[project]
name = "infrastructurego"
version = "0.1.0"
description = "The data and model pipeline of InfrastructureGO, a game that finds Princeton's storm drains"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "geopandas>=1.1,<2",
    "pyogrio",
    "shapely",
    "pyproj",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn>=1.6,<2",
    "pillow>=12",
    "pillow-heif",
    "matplotlib",
    "requests",
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/igo"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-rs"
