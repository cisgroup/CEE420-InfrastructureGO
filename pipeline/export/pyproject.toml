[project]
name = "infrastructurego-export"
version = "0.1.0"
description = "The Core ML export of InfrastructureGO, in an environment of its own because coremltools is tested against an older PyTorch than the pipeline trains with"
requires-python = "==3.12.*"
dependencies = [
    "coremltools==9.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy",
    "pillow",
]

[tool.uv]
package = false
